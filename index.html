<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ritmo4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>
<main id="menu">
  <h1>Ritmo4</h1>
  <p class="sub">4 carriles · teclado o pantalla táctil</p>
  <label>Tu canción (MP3, WAV, OGG)
    <input type="file" id="file" accept="audio/*">
  </label>
  <p id="status">Sin archivo: se juega la canción demo.</p>
  <label>Teclas
    <select id="keys">
      <option value="f">F1 F2 F3 F4</option>
      <option value="d">D F J K</option>
    </select>
  </label>
  <label>Dificultad
    <select id="diff"><option value="0">Fácil</option><option value="1" selected>Normal</option><option value="2">Difícil</option></select>
  </label>
  <label>Compensación de latencia: <b id="offV">0</b> ms
    <input type="range" id="off" min="-200" max="300" step="5" value="0">
  </label>
  <p class="hint">Si pulsás siempre tarde (ej. con Bluetooth), subí la compensación. Si pulsás temprano, bajala.</p>
  <button id="play">Jugar</button>
  <p class="hint">Si fallás, el tema baja de volumen y suena un zumbido. Esc para salir.</p>
</main>
<script src="game.js"></script>
</body>
</html>
